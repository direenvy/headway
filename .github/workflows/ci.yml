name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["results/**", "frontend/data/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Model tests and mart replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Rebuild the marts from the committed backtest
        # The dashboard's numbers must be reproducible from results/backtest.csv
        # without re-running the six-minute backtest.
        run: |
          python -m headway.run marts --fetch
          git diff --stat -- frontend/data

  frontend:
    name: Dashboard builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
