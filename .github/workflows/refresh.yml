name: Refresh

# Turnstile publishes new months as data.gov.my releases them. Once a week this
# fetches Turnstile's checked table, re-runs the whole backtest and the forecast
# ahead, and commits the results so the dashboard redeploys with them.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Backtest, forecast, marts
        run: python -m headway.run all --fetch 2>&1 | tee run.log
      - name: Commit what changed
        run: |
          git config user.name "headway-bot"
          git config user.email "headway-bot@users.noreply.github.com"
          git add results frontend/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            last=$(python -c "import json;print(json.load(open('frontend/data/summary.json'))['last_date'])")
            mase=$(python -c "import json;print(json.load(open('frontend/data/summary.json'))['lgbm_mase'])")
            git commit -m "Refresh $(date -u +%F): data to ${last}, LightGBM MASE ${mase}"
            git push
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 30
